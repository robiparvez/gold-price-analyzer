repos:
    - repo: https://github.com/charliermarsh/ruff-pre-commit
      rev: v0.0.450
      hooks:
          - id: ruff
            args: [--fix]

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.5.1
      hooks:
          - id: mypy

    - repo: https://github.com/pre-commit/mirrors-pytest
      rev: v7.4.0
      hooks:
          - id: pytest

    - repo: local
      hooks:
          - id: ai-pr-review
            name: AI Pre-commit PR Review
            entry: python .pre-commit/ai_review_local.py
            language: python
            types: [python]
