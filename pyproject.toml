[project]
name = "gold-price-analyzer"
version = "0.1.0"
description = "Professional gold price analyzer with ML forecasting, investment tracking, jewelry pricing calculator, and comprehensive backtesting capabilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gold Price Analyzer", email = "analyzer@goldprice.com" }]
keywords = [
    "gold",
    "price",
    "analysis",
    "machine learning",
    "streamlit",
    "time-series",
    "forecasting",
    "investment tracking",
    "portfolio management",
    "jewelry pricing",
    "backtesting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "streamlit==1.50.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "prophet>=1.1.4",
    "httpx>=0.25.0",
    "plotly>=5.15.0",
    "aiohttp>=3.8.0",
    "nest-asyncio>=1.5.0",
    "xgboost>=2.0.0",
    "optuna>=3.0.0",
    "duckdb>=0.9.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = ["black>=25.9.0", "isort>=7.0.0", "mypy>=1.18.2", "pytest>=8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]              # Black handles line length
